x-kurrier-env: &kurrier-env
  WEB_PORT: "3000"
  WEB_URL: ${SERVICE_URL_WEB_3000:-${SERVICE_URL_WEB:-}}
  NITRO_PORT: "3001"
  HOST: 0.0.0.0
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
  POSTGRES_DB: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql://postgres:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/postgres
  DATABASE_RLS_URL: postgresql://kurrier:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/postgres
  REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  TYPESENSE_API_KEY: ${SERVICE_PASSWORD_64_TYPESENSE}
  TYPESENSE_PORT: "8108"
  TYPESENSE_PROTOCOL: http
  TYPESENSE_HOST: typesense
  JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
  APP_SECRET_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_APP_SECRET}
  SEARCH_REBUILD_ON_BOOT: "false"
  DAV_URL: http://dav:80
  DAV_DATABASE_URL: postgresql://baikal:strong_baikal_password@baikal-postgres:5432/baikal
  WORKER_URL: http://worker:3001
  GARAGE_ACCESS_KEY: ${SERVICE_USER_GARAGE}
  GARAGE_SECRET_KEY: ${SERVICE_PASSWORD_64_GARAGE}
  GARAGE_BUCKET: kurrier-store
  S3_ENDPOINT: http://garage:3900
  S3_ACCESS_KEY: ${SERVICE_USER_GARAGE}
  S3_SECRET_KEY: ${SERVICE_PASSWORD_64_GARAGE}
  S3_BUCKET: kurrier-store
  S3_REGION: garage
  S3_FORCE_PATH_STYLE: "true"
  OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
  OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}

services:
  init-files:
    build:
      context: ./db
      dockerfile: Dockerfile.coolify-init
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - garage-config:/target/garage-config
      - baikal-init:/target/baikal-init
      - dav-config:/target/dav-config
    entrypoint: [ "/bin/sh", "/seed/coolify-init.sh" ]
    exclude_from_hc: true

  web:
    image: ghcr.io/kurrier-org/kurrier-web:v3.0.10
    restart: unless-stopped
    depends_on:
      init-files:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *kurrier-env
      SERVICE_URL_WEB_3000: ${SERVICE_URL_WEB_3000:-}

  worker:
    image: ghcr.io/kurrier-org/kurrier-worker:v3.0.10
    restart: unless-stopped
    depends_on:
      init-files:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *kurrier-env

  redis:
    image: redis:8.2.2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --stop-writes-on-bgsave-error
      - "no"
      - --requirepass
      - ${SERVICE_PASSWORD_64_REDIS}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_64_REDIS}", "PING" ]
      interval: 2s
      timeout: 1s
      retries: 30
    volumes:
      - redis-data:/data

  dav:
    image: ckulka/baikal:nginx
    restart: always
    depends_on:
      init-files:
        condition: service_completed_successfully
      baikal-postgres:
        condition: service_started
    volumes:
      - dav-config:/var/www/baikal/config
      - dav-data:/var/www/baikal/Specific

  typesense:
    image: typesense/typesense:29.0
    restart: on-failure
    command: >
      --data-dir /data
      --api-key=${SERVICE_PASSWORD_64_TYPESENSE}
      --enable-cors
    environment:
      TYPESENSE_API_KEY: ${SERVICE_PASSWORD_64_TYPESENSE}
    volumes:
      - typesense-data:/data

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    depends_on:
      init-files:
        condition: service_completed_successfully
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${SERVICE_USER_GARAGE}
      GARAGE_DEFAULT_SECRET_KEY: ${SERVICE_PASSWORD_64_GARAGE}
      GARAGE_DEFAULT_BUCKET: kurrier-store
    volumes:
      - garage-config:/etc/garage
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    command: >
      /garage -c /etc/garage/garage.toml server
      --single-node
      --default-bucket

  baikal-postgres:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      init-files:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: baikal
      POSTGRES_PASSWORD: strong_baikal_password
      POSTGRES_DB: baikal
    volumes:
      - baikal-data:/var/lib/postgresql
      - baikal-init:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=4MB

  postgres:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      init-files:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c work_mem=4MB

  migrate:
    build:
      context: ./db
      dockerfile: Dockerfile.coolify-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      PGDATABASE: postgres
    entrypoint: [ "/bin/bash", "/scripts/coolify-db-bootstrap.sh" ]
    exclude_from_hc: true

volumes:
  baikal-data:
  baikal-init:
  dav-config:
  dav-data:
  garage-config:
  garage-data:
  garage-meta:
  postgres-data:
  redis-data:
  typesense-data:
